# Template. deploy/install.sh fills in @API_PORT@ and @WEB_PORT@ and installs
# this as /etc/nginx/snippets/ssn-vault-app.conf, shared by the http bootstrap
# site and the https site so the two route requests identically.

client_max_body_size 10m;       # receipts are capped at 8 MB by the API
proxy_read_timeout   120s;      # report exports and PDFs
proxy_send_timeout   120s;

# API: the backend serves its routes under /api itself, so the prefix is kept
# (no trailing slash on proxy_pass).
location /api/ {
    proxy_pass http://127.0.0.1:@API_PORT@;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
}

# Throttle password guessing before it reaches Node: burst 5, then 1 every 6s
# per address. The API has its own lockout as well.
location = /api/auth/login {
    limit_req zone=ssn_vault_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:@API_PORT@;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
}

# Frontend
location / {
    proxy_pass http://127.0.0.1:@WEB_PORT@;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
}

access_log /var/log/nginx/ssn-vault.access.log;
error_log  /var/log/nginx/ssn-vault.error.log;

# Template, stage 1 of 2. deploy/install.sh installs this as
# /etc/nginx/sites-available/ssn-vault before a certificate exists, so certbot
# can prove control of @DOMAIN@ over plain http. It answers the challenge and
# nothing else: the application is never served unencrypted. Replaced by
# nginx-ssn-vault-https.conf as soon as the certificate is issued.

server {
    listen      80;
    listen      [::]:80;
    server_name @DOMAIN@;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 503 "SSN Vault is being set up; https is on its way.\n"; }
}

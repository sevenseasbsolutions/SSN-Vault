<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Vault — Company Finance</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2310b981'/><path d='M9 10h4l3 9 3-9h4l-5 13h-4z' fill='%23041210'/></svg>">
</head>
<body>
  <div id="root" class="app-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5l6 14h1l6-14"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong id="brand-name">Vault</strong>
          <small>Company finance</small>
        </span>
      </div>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="sidebar-foot">
        <button class="theme-toggle" id="theme-toggle" type="button" title="Switch between dark and light">
          <span>Theme</span>
        </button>
        <div class="user-chip" id="user-chip"></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open navigation"
                aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <div class="topbar-title">
          <h1 id="page-title">Dashboard</h1>
          <p id="page-subtitle"></p>
        </div>
        <div class="topbar-actions" id="page-actions"></div>
      </header>
      <div id="demo-banner" class="demo-banner" hidden>
        <strong>Demo mode</strong>
        <span>Sample jobs and expenses. Clearing them keeps your company structure.</span>
      </div>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="login" class="login-shell" hidden>
    <form class="login-card" id="login-form" autocomplete="on">
      <div class="brand login-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5l6 14h1l6-14"/>
          </svg>
        </span>
        <span class="brand-text"><strong>Vault</strong><small>Company finance</small></span>
      </div>
      <h2>Sign in</h2>
      <p class="muted">Jobs, expenses, tax holds and how each SSN&rsquo;s share moves up the company.</p>
      <label class="field">
        <span>Email</span>
        <input type="email" name="email" id="login-email" required autocomplete="username" autofocus>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" id="login-password" required autocomplete="current-password">
      </label>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit" id="login-submit">Sign in</button>
    </form>
  </div>

  <div id="boot" class="boot"><div class="spinner" aria-label="Loading"></div></div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>

  <script src="/vendor/chart.umd.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
